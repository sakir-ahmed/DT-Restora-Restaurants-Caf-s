name: Flutter app CI

on:
  push:
    paths: ["flutter-app/**", ".github/workflows/flutter-app.yml"]
  pull_request:
    paths: ["flutter-app/**", ".github/workflows/flutter-app.yml"]

defaults:
  run:
    working-directory: flutter-app

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
